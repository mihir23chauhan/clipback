<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>clipback settings</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <h1>clipback</h1>
    <p class="sub">Clip a YouTube segment into a written note, without leaving the page.</p>

    <label for="provider">Provider</label>
    <select id="provider"></select>

    <label for="apiKey">API key</label>
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false" />
    <p class="hint" id="keyHint"></p>

    <label for="segment">Segment length</label>
    <select id="segment">
      <option value="60">1 minute</option>
      <option value="180" selected>3 minutes</option>
      <option value="300">5 minutes</option>
    </select>

    <label for="mode">Mode</label>
    <select id="mode">
      <option value="captions" selected>Captions — free</option>
      <option value="video">Video — about 1.7&cent; a clip</option>
    </select>
    <p class="hint" id="modeHint"></p>

    <section id="disclosure" class="disclosure" hidden>
      <p id="disclosureText"></p>
      <div class="row">
        <button id="disclosureAccept" type="button" class="primary"></button>
        <button id="disclosureDecline" type="button" class="ghost"></button>
      </div>
    </section>

    <div class="row">
      <button id="save" type="button" class="primary">Save</button>
      <button id="clearKey" type="button" class="ghost">Clear key</button>
    </div>
    <p class="status" id="status"></p>

    <script type="module" src="options.js"></script>
  </body>
</html>
